# Generated from vhco-pro/.github workflow-templates/codeql-go.yml

name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "33 4 * * 2"

# Least-privilege at top level; reusable workflow raises per-job.
permissions: {}


jobs:
  analyze:
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: vhco-pro/.github/.github/workflows/reusable-codeql-go.yml@226e62858dad89c38a8e436777a594839ba4299f # main # main
    with:
      # Pin the exact Go release rather than "stable": actions/setup-go resolves
      # "stable" from its own versions-manifest, which lags a Go release by days.
      # On 2026-08-14 that manifest still topped out at 1.26.5 while go.mod (synced
      # from the monorepo) required 1.26.6, and CodeQL runs with GOTOOLCHAIN=local
      # so Go cannot self-upgrade - every sync PR failed analyze and stalled the
      # satellite release. An exact version is fetched from go.dev even when the
      # manifest lacks it. Keep this in lockstep with the monorepo go.mod.
      # Track backend/go.mod (synced from the monorepo) rather than hand-copying the
      # version here. Four hand-maintained pins drifting out of lockstep with go.mod is
      # exactly what stalled satellite releases three times.
      go-version-file: backend/go.mod
    permissions:
      security-events: write
      contents: read
      actions: read
